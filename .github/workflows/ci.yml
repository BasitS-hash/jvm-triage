name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Enforce coverage floor
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          def pct(kind):
              for c in root.findall('counter'):
                  if c.get('type') == kind:
                      missed, covered = int(c.get('missed')), int(c.get('covered'))
                      return 100.0 * covered / (missed + covered)
              return 0.0
          line, branch = pct('LINE'), pct('BRANCH')
          print(f"line={line:.1f}% branch={branch:.1f}%")
          if line < 80.0:
              sys.exit(f"line coverage {line:.1f}% is below the 80% floor")
          PY

      - name: End-to-end check against a real JVM dump
        run: |
          set -euo pipefail
          # Prove the parser handles output from an actual JVM, not just our own
          # test writer — the bugs that mattered were only visible this way.
          mkdir -p /tmp/e2e && cd /tmp/e2e
          cat > LeakDemo.java <<'JAVA'
          import java.util.*;
          public class LeakDemo {
              static final Map<String, byte[]> CACHE = new HashMap<>();
              public static void main(String[] a) throws Exception {
                  for (int i = 0; i < 2000; i++) CACHE.put("key-" + i, new byte[8192]);
                  System.out.println("ready");
                  Thread.sleep(120_000);
              }
          }
          JAVA
          javac LeakDemo.java
          java LeakDemo & PID=$!
          for _ in $(seq 1 30); do jcmd $PID VM.version >/dev/null 2>&1 && break; sleep 1; done
          jcmd $PID GC.heap_dump /tmp/e2e/leak.hprof
          jcmd $PID Thread.print > /tmp/e2e/threads.txt
          kill $PID || true
          cd "$GITHUB_WORKSPACE"
          java -jar target/jvm-triage.jar heap /tmp/e2e/leak.hprof 5 | tee /tmp/e2e/out.txt
          grep -q "class LeakDemo" /tmp/e2e/out.txt \
            || { echo "FAIL: static-field leak not attributed to LeakDemo"; exit 1; }
          grep -q "byte\[\]" /tmp/e2e/out.txt \
            || { echo "FAIL: primitive arrays not named"; exit 1; }
          java -jar target/jvm-triage.jar threads /tmp/e2e/threads.txt

  large-dump:
    name: Dump larger than 2 GiB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Free space before
        run: df -h /tmp "$GITHUB_WORKSPACE"

      # Its own job rather than a step in the matrix: the fixture is 3.25 GiB of file and
      # the build above must stay a fast gate on every push. One JDK is enough — this
      # tests offset arithmetic, not anything version-specific.
      - name: Run the >2 GiB test
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress -Plarge-dumps test | tee /tmp/large-dump.log

      # The test skips itself when the filesystem looks too small for a non-sparse
      # fixture. That is the right call on a laptop and the wrong outcome here: a gated
      # test that silently never runs is worth nothing, so a skip fails this job.
      - name: Confirm it ran, and print the measurements
        run: |
          set -euo pipefail
          report=target/surefire-reports/dev.basit.jvmtriage.hprof.AboveTwoGibibytesTest.txt
          grep -q "Tests run: 1, Failures: 0, Errors: 0, Skipped: 0" "$report" \
            || { cat "$report"; echo "FAIL: the >2 GiB test did not run"; exit 1; }
          grep "\[above-2GiB\]" /tmp/large-dump.log

      - name: Free space after
        if: always()
        run: df -h /tmp "$GITHUB_WORKSPACE"
